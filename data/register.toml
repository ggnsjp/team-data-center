# Data register: every dataset the models use, where it is kept, under which terms, how it is
# made and what checks it. docs/data-accountability.md explains the fields;
# tests/test_data_register.py keeps this file true (every committed data file is listed here and
# matches data/SHA256SUMS; every script, module and test named below exists).
#
# terms: short licence id (the Licence node in the lineage graph); licence: the conditions in words
#
# storage:
#   git      committed; its bytes are pinned in data/SHA256SUMS
#   code     values written in a source file, each with its source or assumption in docs/data-sources.md
#   local    downloaded or generated on each machine into a git-ignored folder; rebuilt by `made_by`
#
# Add a dataset: add an entry here, a row in docs/data-sources.md, and for storage = "git" run
#   uv run python -m dcopt.common.provenance --write

[[dataset]]
id = "curated-data-centers"
title = "Ishikari data centers: operators, status and IT load range"
storage = "git"
paths = ["data/curated/ishikari_data_centers.csv"]
terms = "MIT"
licence = "MIT (our own compilation of published facts)"
sources = ["docs/data-sources.md#data-centers-in-ishikari"]
made_by = "compiled by hand from public pages"
processing = "Facts copied from the cited pages; every row names its URLs. IT load ranges are assumptions where no MW figure is published, and each row says so."
used_by = ["src/dcopt/heat/network.py"]
checks = ["tests/test_data_and_docs.py"]
refresh = "When an operator publishes new figures; update the row and its sources together."

[[dataset]]
id = "jma-daily-sapporo"
title = "JMA daily mean temperature and snowfall, Sapporo (station 47412), 1976-2025"
storage = "git"
paths = ["data/jma/sapporo_47412_daily_*.csv"]
terms = "JMA-PDTU-1.0"
licence = "JMA website terms (Public Data Terms of Use 1.0, compatible with CC BY 4.0): credit the source and state the processing. Not MIT."
attribution = "出典：気象庁ホームページ / Source: Japan Meteorological Agency website (see data/jma/README.md)"
sources = ["https://www.data.jma.go.jp/obd/stats/etrn/view/daily_s1.php?prec_no=14&block_no=47412",
           "https://www.jma.go.jp/jma/kishou/info/coment.html"]
made_by = "uv run python -m dcopt.heat.weather 1976 2025"
code = ["src/dcopt/heat/weather.py"]
processing = "Each month's daily table is parsed (parse_month) and written as one CSV per year (month, day, t_mean_c, snow_cm). Values are unchanged. On loading, a day without a temperature is filled with its month's mean and counted (WeatherYear.n_missing_t)."
used_by = ["src/dcopt/heat/weather.py", "src/dcopt/heat/proposal.py", "experiments/weather_years/run.py",
           "app/pages/4_Warm_Ishikari_Weather.py"]
checks = ["tests/test_data_register.py", "tests/test_weather.py", "tests/test_weather_fallback.py"]
refresh = "Once a year, after JMA finalises the previous year: extend YEARS in weather.py, run made_by, then --write."

[[dataset]]
id = "jma-normals-sapporo"
title = "JMA climate normals 1991-2020, Sapporo: monthly mean temperature and snowfall"
storage = "code"
paths = ["src/dcopt/heat/v1.py"]
terms = "JMA-PDTU-1.0"
licence = "JMA website terms (as above); twelve monthly values with the source cited in the code"
sources = ["https://www.data.jma.go.jp/obd/stats/etrn/view/nml_sfc_ym.php?prec_no=14&block_no=47412"]
made_by = "copied by hand from the JMA normals page (TEMP, SNOW in v1.py)"
processing = "None. weather.py derives its daily constants HDD18_N, HDD15_N and SNOW_N from data/jma for 1991-2020."
used_by = ["src/dcopt/heat/v1.py", "src/dcopt/heat/weather.py", "src/dcopt/heat/network.py"]
checks = ["tests/test_data_register.py", "tests/test_coefficients.py"]
refresh = "When JMA publishes the 2001-2030 normals (expected 2031)."

[[dataset]]
id = "model-parameters"
title = "Model parameters: prices, efficiencies, temperatures, pipe costs, peak factors"
storage = "code"
paths = ["src/dcopt/heat/network.py", "src/dcopt/heat/v1.py"]
terms = "MIT"
licence = "MIT; each value names its source or is marked as an assumption"
sources = ["docs/data-sources.md"]
made_by = "set in Params() and the module constants; the table in docs/data-sources.md is generated by assumptions_table(Params())"
processing = "None."
used_by = ["src/dcopt/heat/network.py", "src/dcopt/heat/proposal.py"]
checks = ["tests/test_data_and_docs.py", "tests/test_coefficients.py"]
refresh = "When a price survey or quote changes; update the value, its basis and docs/data-sources.md together."

[[dataset]]
id = "osm-ishikari"
title = "OpenStreetMap: boundary, road network, facilities and candidate heat users for the study area"
storage = "local"
paths = ["data/cache/", "data/raw/"]
terms = "ODbL-1.0"
licence = "ODbL 1.0, © OpenStreetMap contributors. Never committed; outputs that show it credit OSM."
sources = ["https://www.openstreetmap.org/copyright"]
made_by = "uv run python scripts/fetch_data.py --area ishikari"
code = ["scripts/fetch_data.py", "src/dcopt/common/geo.py"]
processing = "Downloaded through osmnx (Nominatim and Overpass), clipped to the study area and saved as GeoJSON and GraphML; floor and land areas are computed from the polygons."
used_by = ["src/dcopt/heat/v1.py", "src/dcopt/heat/network.py", "app/pages/1_Warm_Ishikari.py",
           "app/pages/2_Warm_Ishikari_Map.py"]
checks = ["tests/test_data_and_docs.py"]
refresh = "OSM changes daily; re-run made_by before a run whose results are published, and record the date."

[[dataset]]
id = "results"
title = "Generated results: experiment outputs, proposal exports and map exports"
storage = "local"
paths = ["results/", "out/"]
terms = "MIT + ODbL-1.0 where maps are drawn"
licence = "MIT for our numbers; anything that draws OSM data inherits ODbL and credits it"
sources = []
made_by = "experiments/*/run.py and scripts/export_*.py"
code = ["experiments/weather_years/run.py", "scripts/export_proposals.py", "scripts/export_heat_story.py"]
processing = "Computed from the datasets above. Each experiment writes a provenance block (git commit, uncommitted changes, data fingerprint, package versions) next to its results."
used_by = ["app/pages/3_Warm_Ishikari_Proposals.py"]
checks = ["tests/test_proposal.py", "tests/test_properties.py", "tests/test_bruteforce.py"]
refresh = "Re-run after any change to the data or the model."
